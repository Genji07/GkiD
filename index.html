<style>
:root {
  --bg: #FFF8E7;
  --primary: #FF8C42;
  --secondary: #4ECDC4;
  --accent: #FFE66D;
  --text: #2C3E50;

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: system-ui, "Segoe UI", sans-serif;
  background: var(--bg);

}

button {

  cursor: pointer;
  touch-action: manipulation;
}

#app {
  min-height: 100dvh;
  padding: 16px;
}

.screen {
  display: none;
  min-height: calc(100dvh - 32px);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 65px 8px 24px;
}

.screen.active {
  display: flex;
}

h1 {
  color: var(--primary);
  font-size: clamp(42px, 12vw, 68px);
  margin: 8px 0;
  font-weight: 950;
}

h2 {
  font-size: clamp(23px, 6vw, 34px);
  margin: 12px 0;
}

p {
  font-size: clamp(16px, 4.3vw, 21px);
  line-height: 1.5;
}

.btn {
  background: var(--primary);
  color: white;
  border: 0;
  border-radius: 22px;
  padding: 17px 25px;
  min-height: 60px;
  font-size: 18px;
  font-weight: 800;
  margin: 7px;

.btn.secondary {

}

.btn:active,
.card:active {

}

.grid {

  width: 100%;
  max-width: 620px;
  margin: 18px auto;
}

.g2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.g3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.card {
  background: white;
  border: 4px solid transparent;

  align-items: center;

}

.card.correct {

.card.wrong {

.pic {

.photo-pic {

.label {

.big-letter {

<script>
'use strict';

/* ---------------- STATE ---------------- */

const STORE = {
  stars: 'gkid2_stars',
  sound: 'gkid2_sound',
  animation: 'gkid2_animation',
  progress: 'gkid2_progress'
};

const state = {
  age: 0,
  world: null,
  level: 1,
  question: 1,
  totalQuestions: 5,
  stars: readNumber(STORE.stars, 0),
  sound: readValue(STORE.sound, 'on') !== 'off',
  animation: readValue(STORE.animation, 'on') !== 'off',
  progress: readJSON(STORE.progress, {}),
  instruction: '',
  answered: false,
  rewardAction: null
};

function readValue(key, fallback) {
  try {
    return localStorage.getItem(key) ?? fallback;
  } catch {
    return fallback;
  }
}

function readNumber(key, fallback) {
  const n = Number(readValue(key, String(fallback)));
  return Number.isFinite(n) && n >= 0 ? n : fallback;
}

function readJSON(key, fallback) {
  try {
    const value = JSON.parse(readValue(key, 'null'));
    return value && typeof value === 'object' ? value : fallback;
  } catch {
    return fallback;
  }
}

function save(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {
    toast('Storan tidak tersedia. Kemajuan mungkin tidak disimpan.');
  }
}

/* ---------------- VOICE ---------------- */

let selectedVoice = null;
let animalAudio = null;
let voiceTimer = null;
let musicContext = null;

function loadVoices() {
  if (!('speechSynthesis' in window)) return;

  const voices = speechSynthesis.getVoices();

  selectedVoice =
    voices.find(v => /^ms(-|_)/i.test(v.lang)) ||
    voices.find(v => /malay|melayu/i.test(v.name + ' ' + v.lang)) ||
    voices.find(v => /^id(-|_)/i.test(v.lang)) ||
    voices.find(v => /^en(-|_)/i.test(v.lang)) ||
    voices[0] ||
    null;
}

if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function stopVoice() {
  clearTimeout(voiceTimer);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (musicContext) {
    const contextToClose = musicContext;
    musicContext = null;
    try { contextToClose.close(); } catch {}
  }
  if (animalAudio) {
    animalAudio.pause();
    animalAudio.currentTime = 0;
    animalAudio = null;
  }
}

function speak(text) {
  if (!state.sound || !text) return;

  if (!('speechSynthesis' in window)) {
    toast('Suara tidak disokong oleh pelayar ini.');
    return;
  }

  stopVoice();
  loadVoices();

  const utterance = new SpeechSynthesisUtterance(String(text));
  utterance.lang = selectedVoice?.lang || 'ms-MY';
  utterance.rate = 0.82;
  utterance.pitch = 1.08;

  if (selectedVoice) utterance.voice = selectedVoice;

  // Sesetengah telefon tidak memulakan suara dengan segera.
  voiceTimer = setTimeout(() => {
    try {
      speechSynthesis.speak(utterance);
    } catch {
      toast('Tidak dapat memainkan suara.');
    }
  }, 100);
}

function playSpellingSong() {
  if (!state.sound) {
    toast('Hidupkan bunyi dalam tetapan ibu bapa dahulu.');
    return;
  }
  if (!('AudioContext' in window) && !('webkitAudioContext' in window)) {
    speak('Mari belajar, mari mengeja. A, B, C, sebut bersama. B, O, L, A, bola. B, U, K, U, buku. Baca dan eja, kita berjaya!');
    return;
  }

  stopVoice();
  loadVoices();

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  let context;
  try {
    context = new AudioContextClass();
    musicContext = context;
  } catch {
    speak('Mari belajar, mari mengeja. A, B, C, sebut bersama. B, O, L, A, bola. B, U, K, U, buku. Baca dan eja, kita berjaya!');
    return;
  }

  // Melodi asli ringkas dijana dalam telefon, jadi tidak memerlukan fail muzik luar.
  const notes = [
    262, 294, 330, 262, 262, 294, 330, 262,
    330, 349, 392, 392, 330, 349, 392, 392,
    392, 440, 392, 349, 330, 262, 392, 330,
    294, 262, 294, 330, 349, 330, 294, 262
  ];
  const startAt = context.currentTime + 0.08;
  const beat = 0.22;

  notes.forEach((frequency, index) => {
    const start = startAt + index * beat;
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.10, start + 0.025);
    gain.gain.setValueAtTime(0.10, start + beat * 0.65);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + beat * 0.92);
    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start(start);
    oscillator.stop(start + beat);
  });

  const lyrics = 'Mari belajar, mari mengeja. A, B, C, sebut bersama. B, O, L, A, bola. B, U, K, U, buku. Baca dan eja, kita berjaya!';
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
    context.resume().catch(() => {});
    setTimeout(() => {
      if (musicContext === context) {
        musicContext = null;
        try { context.close(); } catch {}
      }
    }, notes.length * beat * 1000 + 250);
    toast('Melodi dimainkan. Suara sebutan tidak disokong oleh pelayar ini.');
    return;
  }
  const utterance = new SpeechSynthesisUtterance(lyrics);
  utterance.lang = selectedVoice?.lang || 'ms-MY';
  utterance.rate = 0.78;
  utterance.pitch = 1.12;
  if (selectedVoice) utterance.voice = selectedVoice;
  const finishMusic = () => {
    if (musicContext === context) {
      musicContext = null;
      try { context.close(); } catch {}
    }
  };
  utterance.onend = finishMusic;
  utterance.onerror = finishMusic;

  context.resume().then(() => {
    if (musicContext === context && 'speechSynthesis' in window) {
      speechSynthesis.speak(utterance);
    }
  }).catch(() => {
    finishMusic();
    toast('Audio tidak dapat dimainkan pada telefon ini.');
  });
}

function playAnimalSound(animal) {
  if (!state.sound) {
    toast('Hidupkan bunyi dalam tetapan ibu bapa dahulu.');
    return;
  }
  if (!animal.audio) {
    toast('Bunyi sebenar untuk ikan belum disediakan.');
    return;
  }
  if (animalAudio) {
    animalAudio.pause();
    animalAudio.currentTime = 0;
  }
  animalAudio = new Audio(animal.audio);
  animalAudio.preload = 'none';
  animalAudio.onerror = () => toast('Bunyi tidak dapat dimuatkan. Semak sambungan internet.');
  const playback = animalAudio.play();
  if (playback && typeof playback.catch === 'function') {
    playback.catch(() => toast('Telefon tidak dapat memainkan fail bunyi ini.'));
  }
}

function repeatInstruction() {
  speak(state.instruction);
}

/* ---------------- NAVIGATION ---------------- */

function showScreen(id, renderParentSettings = true) {
  stopVoice();

  document.querySelectorAll('.screen').forEach(screen => {
    screen.classList.remove('active');
  });

  const target = document.getElementById(id);
  if (target) target.classList.add('active');

  document.getElementById('topBar').hidden = id !== 'activity';

  if (id === 'worlds') renderWorlds();
  if (id === 'parent' && renderParentSettings) renderParent();
}

function updateCounter() {
  document.getElementById('progressCounter').textContent =
    '⭐ ' + state.stars;
}

function toast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.style.display = 'none', 2400);
}

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function sample(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function choices(correct, pool, count = 3) {
  const rest = shuffle(pool.filter(x => x !== correct))
    .slice(0, count - 1);

  return shuffle([correct, ...rest]);
}

function renderAges() {
  const grid = document.getElementById('ageGrid');
  grid.innerHTML = '';

  AGES.forEach((age, index) => {
    const button = document.createElement('button');
    button.className = 'age-button';
    button.textContent = age.label;

    button.onclick = () => {
      state.age = index;
      showScreen('worlds');
      speak('Umur ' + age.label);
    };

    grid.appendChild(button);
  });
}

function renderWorlds() {
  document.getElementById('ageInfo').textContent =
    'Umur dipilih: ' + AGES[state.age].label;

  const grid = document.getElementById('worldGrid');
  grid.innerHTML = '';

  Object.entries(WORLDS).forEach(([key, world]) => {
    const card = document.createElement('button');
    card.className = 'card';

    if (key === AGES[state.age].recommended) {
      card.style.borderColor = 'var(--secondary)';
    }

    card.innerHTML =
      `<span class="pic">${world.icon}</span>
       <span class="label">${world.name}</span>`;

    card.onclick = () => renderLevels(key);
    grid.appendChild(card);
  });
}

function renderLevels(key) {
  state.world = key;

  document.getElementById('levelHeading').textContent =
    WORLDS[key].name;

  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';

  [1, 2, 3].forEach(level => {
    const card = document.createElement('button');
    card.className = 'card';

    const done = state.progress[key + '_' + level] || 0;

    card.innerHTML =
      `<span class="pic">${['🥚','🐣','🏆'][level-1]}</span>
       <span class="label">Level ${level}</span>
       <span class="label">${Math.min(done, 5)}/5 selesai</span>`;

    card.onclick = () => startLevel(key, level);
    grid.appendChild(card);
  });

  showScreen('levels');
}

function startLevel(key, level) {
  state.world = key;
  state.level = level;
  state.question = 1;
  state.answered = false;

  showScreen('activity');
  nextActivity();
}

function exitActivity() {
  stopVoice();
  renderLevels(state.world);
}

function nextActivity() {
  state.answered = false;
  updateCounter();

  if (state.question > state.totalQuestions) {
    finishLevel();
    return;
  }

  makeQuestion();
}

/* ---------------- GAME UI ---------------- */

function makeQuestion() {
  const el = document.getElementById('activityContent');
  el.innerHTML = '';

  const heading = document.createElement('h2');
  heading.textContent = WORLDS[state.world].name;

  const number = document.createElement('p');
  number.textContent =
    'Soalan ' + state.question + ' daripada ' + state.totalQuestions;

  el.append(heading, number);

  const content = document.createElement('div');
  el.appendChild(content);

  const key = state.world;
  const level = state.level;

  if (key === 'sensory') sensoryQuestion(content);
  else if (key === 'match') matchQuestion(content, level);
  else if (key === 'count') countQuestion(content, level);
  else if (key === 'compare') compareQuestion(content, level);
  else if (key === 'word') wordQuestion(content, level);
  else if (key === 'abc') abcQuestion(content, level);
  else if (key === 'emotion') emotionQuestion(content, level);
  else if (key === 'pattern') patternQuestion(content, level);

  const hint = document.createElement('p');
  hint.id = 'feedback';
  hint.setAttribute('aria-live', 'polite');
  content.appendChild(hint);
}

function title(content, text) {
  const p = document.createElement('p');
  p.textContent = text;
  p.style.fontWeight = '850';
  content.appendChild(p);
}

function visual(content, icon, label = '') {
  const animal = ANIMALS.find(item => item.icon === icon && item.image);
  if (animal) {
    const img = document.createElement('img');
    img.className = 'photo-pic';
    img.src = animal.image;
    img.alt = animal.name;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.onerror = () => {
      const fallback = document.createElement('div');
      fallback.className = 'big-pic';
      fallback.textContent = icon;
      img.replaceWith(fallback);
    };
    content.appendChild(img);
  } else {
    const div = document.createElement('div');
    div.className = 'big-pic';
    div.textContent = icon;
    content.appendChild(div);
  }

  if (label) title(content, label);
}

function cardGrid(content, items, onPick, columns = 3) {
  const grid = document.createElement('div');
  grid.className = 'grid g' + columns;

  items.forEach(item => {
    const card = document.createElement('button');
    card.className = 'card';

    const animalPhoto = ANIMALS.find(animal => animal.icon === item.icon);
    // Kad kecil guna thumbnail 500px supaya ringan; paparan utama guna 960px.
    const imageUrl = animalPhoto?.image
      ? animalPhoto.image.replace('?width=960', '?width=500')
      : item.image;
    let icon;
    if (imageUrl) {
      icon = document.createElement('img');
      icon.className = 'pic photo-pic';
      icon.src = imageUrl;
      icon.alt = item.name || item.word || item.letter || 'Gambar pembelajaran';
      icon.loading = 'lazy';
      icon.decoding = 'async';
      icon.onerror = () => {
        const fallback = document.createElement('span');
        fallback.className = 'pic';
        fallback.textContent = item.icon ?? item.letter ?? item.word ?? '?';
        icon.replaceWith(fallback);
      };
    } else {
      icon = document.createElement('span');
      icon.className = 'pic';
      icon.textContent = item.icon ?? item.letter ?? item.word ?? '?';
    }

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = item.label ?? item.name ?? item.word ?? '';

    card.append(icon);

    if (label.textContent) card.append(label);

    card.onclick = () => onPick(item, card);
    grid.appendChild(card);
  });

  content.appendChild(grid);
  return grid;
}

function answer(correct, selected, card, feedback = 'Betul!') {
  if (state.answered) return;

  // Bandingkan pilihan berdasarkan kandungan, bukan rujukan objek sahaja.
  // Ini penting untuk kad ABC/perkataan yang dibina daripada salinan objek.
  const sameChoice = selected === correct || (
    selected != null && correct != null &&
    typeof selected === 'object' && typeof correct === 'object' &&
    (
      (selected.letter != null && selected.letter === correct.letter) ||
      (selected.word != null && selected.word === correct.word) ||
      (selected.name != null && selected.name === correct.name &&
        selected.icon != null && selected.icon === correct.icon)
    )
  );

  if (!sameChoice) {
    card.classList.add('wrong');
    speak('Cuba lagi.');
    const f = document.getElementById('feedback');
    if (f) f.textContent = 'Tak mengapa. Cuba lagi!';

    setTimeout(() => card.classList.remove('wrong'), 450);
    return;
  }

  state.answered = true;
  card.classList.add('correct');

  const f = document.getElementById('feedback');
  if (f) f.textContent = feedback;

  state.stars++;
  save(STORE.stars, String(state.stars));
  updateCounter();

  speak(feedback);

  setTimeout(() => {
    state.question++;
    nextActivity();
  }, 900);
}

function finishLevel() {
  const key = state.world + '_' + state.level;

  state.progress[key] = 5;
  save(STORE.progress, JSON.stringify(state.progress));

  if (state.level < 3) {
    reward('🏆', 'Tahniah!', 'Kamu berjaya menamatkan level ini!', () => {
      state.level++;
      state.question = 1;
      showScreen('activity');
      nextActivity();
    });
  } else {
    reward('🌈', 'Dunia Selesai!', 'Hebat! Kamu sudah tamat 3 level.', () => {
      state.world = null;
      renderWorlds();
      showScreen('worlds');
    });
  }
}

/* ---------------- WORLD 1: SENSORY ---------------- */

function sensoryQuestion(content) {
  const animal = sample(ANIMALS);

  title(content, 'Kenali haiwan melalui gambar dan bunyi.');
  visual(content, animal.icon, animal.name);

  const voiceButton = document.createElement('button');
  voiceButton.className = 'btn';
  voiceButton.textContent = '🗣️ Sebut nama haiwan';
  voiceButton.onclick = () => speak('Ini ialah ' + animal.name + '.');
  content.appendChild(voiceButton);

  const soundButton = document.createElement('button');
  soundButton.className = 'btn secondary';
  soundButton.textContent = '🔊 Dengar bunyi sebenar';
  soundButton.onclick = () => playAnimalSound(animal);
  content.appendChild(soundButton);

  const next = document.createElement('button');
  next.className = 'btn secondary';
  next.textContent = 'Dah dengar! Teruskan';

  next.onclick = () => {
    if (state.answered) return;
    state.answered = true;
    state.stars++;
    save(STORE.stars, String(state.stars));
    updateCounter();
    state.question++;
    nextActivity();
  };

  content.appendChild(next);

  state.instruction = 'Ini ialah ' + animal.name +
    '. Sentuh untuk mendengar.';

  speak(state.instruction);
}

/* ---------------- WORLD 2: MATCH ---------------- */

function matchQuestion(content, level) {
  if (level === 1) {
    const target = sample(COLORS);

    title(content, 'Cari warna ' + target.name);
    visual(content, target.icon);

    cardGrid(content, choices(target, COLORS), (item, card) => {
      answer(target, item, card, 'Betul! ' + target.name);
    });

    state.instruction = 'Cari warna ' + target.name;
  } else if (level === 2) {
    const target = sample(ANIMALS);

    title(content, 'Haiwan manakah berbunyi ' + target.sound + '?');

    cardGrid(content, choices(target, ANIMALS), (item, card) => {
      answer(target, item, card, 'Betul! ' + target.name);
    });

    state.instruction = 'Cari haiwan yang berbunyi ' + target.sound;
  } else {
    const target = sample(SHAPES);

    title(content, 'Cari bentuk ' + target.name);

    cardGrid(content, choices(target, SHAPES), (item, card) => {
      answer(target, item, card, 'Betul! ' + target.name);
    });

    state.instruction = 'Cari bentuk ' + target.name;
  }

  speak(state.instruction);
}

/* ---------------- WORLD 3: COUNT ---------------- */

function countQuestion(content, level) {
  const n = level === 1
    ? Math.floor(Math.random() * 3) + 1
    : level === 2
      ? Math.floor(Math.random() * 5) + 1
      : Math.floor(Math.random() * 6) + 5;

  const icon = level === 2 ? '⭐' : sample(ANIMALS).icon;

  title(content, 'Berapa banyak objek?');
  visual(content, icon.repeat(n));

  const pool = level === 3
    ? [5, 6, 7, 8, 9, 10]
    : [1, 2, 3, 4, 5, 6];

  const nums = shuffle([n, ...shuffle(pool.filter(v => v !== n)).slice(0, 2)]);

  cardGrid(content, nums.map(v => ({
    icon: String(v),
    label: 'Pilih nombor'
  })), (item, card) => {
    answer(String(n), item.icon, card, 'Betul! Ada ' + n + ' objek.');
  });

  state.instruction = 'Kira objek. Berapa banyak?';
  speak(state.instruction);
}

/* ---------------- WORLD 4: COMPARE ---------------- */

function compareQuestion(content, level) {
  const a = Math.floor(Math.random() * 5) + 2;
  let b = Math.floor(Math.random() * 5) + 2;

  while (a === b) b = Math.floor(Math.random() * 5) + 2;

  if (level === 3) {
    const pair = shuffle([
      { name: 'Gajah', icon: '🐘', size: 3 },
      { name: 'Kucing', icon: '🐱', size: 2 },
      { name: 'Semut', icon: '🐜', size: 1 }
    ]);

    const target = pair.find(x => x.size === 3);
    title(content, 'Haiwan manakah paling besar?');

    cardGrid(content, pair, (item, card) => {
      answer(target, item, card, 'Betul! Gajah paling besar.');
    }, 3);

    state.instruction = 'Haiwan manakah paling besar?';
  } else {
    const bigger = level === 1;
    const target = bigger ? Math.max(a, b) : Math.min(a, b);

    title(content, bigger ? 'Mana lebih banyak?' : 'Mana lebih sedikit?');

    const items = shuffle([a, b]).map(n => ({
      n,
      icon: '🐻'.repeat(n),
      label: n + ' ekor'
    }));

    cardGrid(content, items.map(item => ({
      ...item,
      icon: item.icon,
      label: item.label
    })), (item, card) => {
      answer(target, item.n, card,
        bigger ? 'Betul! Lebih banyak.' : 'Betul! Lebih sedikit.');
    }, 2);

    state.instruction = bigger ? 'Mana lebih banyak?' : 'Mana lebih sedikit?';
  }

  speak(state.instruction);
}

/* ---------------- WORLD 5: WORD ---------------- */

function wordQuestion(content, level) {
  const word = sample(WORDS);

  visual(content, word.icon);

  const songButton = document.createElement('button');
  songButton.className = 'btn secondary';
  songButton.textContent = '🎵 Dengar lagu Mari Mengeja';
  songButton.onclick = playSpellingSong;
  content.appendChild(songButton);

  const songLyrics = document.createElement('p');
  songLyrics.className = 'setting';
  songLyrics.style.display = 'block';
  songLyrics.textContent = 'Mari belajar, mari mengeja! A-B-C sebut bersama. B-O-L-A, bola! B-U-K-U, buku! Baca dan eja, kita berjaya!';
  content.appendChild(songLyrics);

  if (level === 1) {
    title(content, 'Pilih perkataan yang betul.');

    cardGrid(content, choices(word, WORDS).map(w => ({
      ...w,
      icon: w.word,
      label: 'Perkataan'
    })), (item, card) => {
      answer(word, item, card, 'Betul! ' + word.word);
    });
  } else if (level === 2) {
    title(content, 'Apakah huruf pertama bagi ' + word.word + '?');

    const first = word.word[0];
    const letters = shuffle([
      first,
      ...shuffle('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(x => x !== first)).slice(0, 2)
    ]);

    cardGrid(content, letters.map(l => ({
      letter: l,
      icon: l,
      label: 'Huruf'
    })), (item, card) => {
      answer(first, item.letter, card, 'Betul! Huruf ' + first);
    });
  } else {
    const letters = shuffle(word.word.split(''));

    title(content, 'Susun huruf mengikut turutan perkataan.');

    const slots = document.createElement('div');
    slots.style.fontSize = 'clamp(26px,8vw,44px)';
    slots.style.fontWeight = '900';
    slots.style.letterSpacing = '6px';
    slots.style.margin = '20px 0';
    content.appendChild(slots);

    let position = 0;
    const buttons = document.createElement('div');
    buttons.className = 'grid g3';

    letters.forEach(letter => {
      const button = document.createElement('button');
      button.className = 'card';
      button.textContent = letter;

      button.onclick = () => {
        if (state.answered || button.disabled) return;

        const expected = word.word[position];

        if (letter === expected) {
          position++;
          button.disabled = true;
          button.style.opacity = '.35';
          slots.textContent = word.word.slice(0, position);

          speak(letter);

          if (position === word.word.length) {
            state.answered = true;
            state.stars++;
            save(STORE.stars, String(state.stars));
            updateCounter();

            setTimeout(() => {
              state.question++;
              nextActivity();
            }, 800);
          }
        } else {
          button.classList.add('wrong');
          setTimeout(() => button.classList.remove('wrong'), 400);
          speak('Cuba lagi.');
        }
      };

      buttons.appendChild(button);
    });

    content.appendChild(buttons);
  }

  state.instruction = 'Belajar perkataan ' + word.word;
  speak(state.instruction);
}

/* ---------------- WORLD 6: ABC A-Z ---------------- */

function abcQuestion(content, level) {
  let target;

  if (level === 1) {
    target = sample(ABC);

    title(content, 'Cari huruf yang sama.');

    const big = document.createElement('div');
    big.className = 'big-letter';
    big.textContent = target.letter;
    content.appendChild(big);

    cardGrid(content, choices(target, ABC).map(x => ({
      ...x,
      icon: x.letter,
      label: 'Huruf'
    })), (item, card) => {
      answer(target, item, card,
        'Betul! ' + target.letter + ' untuk ' + target.name);
    });
  } else if (level === 2) {
    target = sample(ABC);

    title(content, 'Cari huruf pertama bagi ' + target.name + '.');
    visual(content, target.icon);

    cardGrid(content, choices(target, ABC).map(x => ({
      ...x,
      icon: x.letter,
      label: 'Huruf'
    })), (item, card) => {
      answer(target, item, card,
        'Betul! ' + target.letter + ' untuk ' + target.name);
    });
  } else {
    target = sample(ABC);

    title(content, 'Padankan huruf dengan gambar.');

    cardGrid(content, choices(target, ABC).map(x => ({
      ...x,
      icon: x.icon,
      label: x.letter + ' — ' + x.name
    })), (item, card) => {
      answer(target, item, card,
        'Betul! ' + target.letter + ' ialah ' + target.name);
    });
  }

  state.instruction = 'Belajar huruf ' + target.letter;
  speak(state.instruction);
}

/* ---------------- WORLD 7: EMOTIONS ---------------- */

function emotionQuestion(content, level) {
  const target = sample(EMOTIONS);

  if (level === 1) {
    title(content, 'Cari muka ' + target.name.toLowerCase() + '.');

    cardGrid(content, choices(target, EMOTIONS), (item, card) => {
      answer(target, item, card, 'Betul! ' + target.name);
    });
  } else {
    const scenarios = [
      { text: 'Dapat hadiah', name: 'Gembira' },
      { text: 'Kehilangan mainan', name: 'Sedih' },
      { text: 'Mainan rosak', name: 'Sedih' },
      { text: 'Dengar bunyi kuat', name: 'Terkejut' }
    ];

    const scenario = sample(scenarios);
    const emotion = EMOTIONS.find(e => e.name === scenario.name);

    title(content, 'Bagaimana perasaan jika ' +
      scenario.text.toLowerCase() + '?');

    cardGrid(content, choices(emotion, EMOTIONS), (item, card) => {
      answer(emotion, item, card,
        'Betul! Perasaan ' + emotion.name.toLowerCase() + '.');
    });
  }

  state.instruction = 'Belajar mengenal emosi.';
  speak(state.instruction);
}

/* ---------------- WORLD 8: PATTERN ---------------- */

function patternQuestion(content, level) {
  if (level === 1) {
    const a = sample(COLORS);
    let b = sample(COLORS);

    while (b === a) b = sample(COLORS);

    title(content, 'Apa warna yang seterusnya?');
    visual(content, [a.icon, b.icon, a.icon, b.icon, a.icon].join(' '));

    cardGrid(content, choices(b, COLORS), (item, card) => {
      answer(b, item, card, 'Betul! Corak berselang-seli.');
    });

    state.instruction = 'Apa warna yang seterusnya?';
  } else if (level === 2) {
    const a = sample(SHAPES);
    let b = sample(SHAPES);

    while (a === b) b = sample(SHAPES);

    title(content, 'Cari bentuk yang berbeza.');

    const items = shuffle([
      { icon: a.icon, name: 'Bentuk biasa' },
      { icon: a.icon, name: 'Bentuk biasa' },
      { icon: a.icon, name: 'Bentuk biasa' },
      { icon: b.icon, name: 'Bentuk berbeza' }
    ]);

    cardGrid(content, items.map((x, i) => ({
      ...x,
      id: i
    })), (item, card) => {
      const correct = item.icon === b.icon;
      if (correct) answer(item, item, card, 'Bagus! Kamu jumpa bentuk berbeza.');
      else {
        card.classList.add('wrong');
        setTimeout(() => card.classList.remove('wrong'), 400);
        speak('Cuba lagi.');
      }
    });
    state.instruction = 'Cari bentuk yang berbeza.';
  } else {
    const target = sample(SHAPES);

    title(content, 'Cari bentuk ' + target.name.toLowerCase() + '.');

    cardGrid(content, choices(target, SHAPES), (item, card) => {
      answer(target, item, card, 'Betul! ' + target.name);
    });

    state.instruction = 'Cari bentuk ' + target.name;
  }

  speak(state.instruction);
}

/* ---------------- REWARDS ---------------- */

function reward(icon, heading, message, callback) {
  stopVoice();

  document.getElementById('rewardPic').textContent = icon;
  document.getElementById('rewardTitle').textContent = heading;
  document.getElementById('rewardMessage').textContent = message;

  state.rewardAction = callback || null;
  document.getElementById('reward').classList.add('show');

  speak(heading + '. ' + message);
}

function closeReward() {
  document.getElementById('reward').classList.remove('show');

  const callback = state.rewardAction;
  state.rewardAction = null;

  if (callback) callback();
}

/* ---------------- PARENT CONTROLS ---------------- */

function parentGate() {
  stopVoice();

  const a = Math.floor(Math.random() * 8) + 3;
  const b = Math.floor(Math.random() * 8) + 3;
  const expected = a + b;

  const panel = document.getElementById('parentContent');
  panel.innerHTML = '';

  const question = document.createElement('h2');
  question.textContent = a + ' + ' + b + ' = ?';
  panel.appendChild(question);

  const grid = document.createElement('div');
  grid.className = 'grid g2';

  shuffle([expected, expected + 2, expected - 1, expected + 3])
    .forEach(value => {
      const button = document.createElement('button');
      button.className = 'btn';
      button.textContent = value;

      button.onclick = () => {
        if (value === expected) {
          showScreen('parent');
        } else {
          toast('Cuba lagi.');
        }
      };

      grid.appendChild(button);
    });

  panel.appendChild(grid);
  // Paparkan soalan pengesahan dahulu; jangan biarkan renderParent()
  // menindih soalan sebelum jawapan dipilih.
  showScreen('parent', false);
}

function renderParent() {
  const panel = document.getElementById('parentContent');
  panel.innerHTML = '';

  const sound = document.createElement('label');
  sound.className = 'setting';
  sound.innerHTML = '<span>🔊 Bunyi</span>';

  const soundInput = document.createElement('input');
  soundInput.type = 'checkbox';
  soundInput.checked = state.sound;

  soundInput.onchange = () => {
    state.sound = soundInput.checked;
    save(STORE.sound, state.sound ? 'on' : 'off');
    if (!state.sound) stopVoice();
  };

  sound.appendChild(soundInput);
  panel.appendChild(sound);

  const animation = document.createElement('label');
  animation.className = 'setting';
  animation.innerHTML = '<span>✨ Animasi</span>';

  const animationInput = document.createElement('input');
  animationInput.type = 'checkbox';
  animationInput.checked = state.animation;

  animationInput.onchange = () => {
    state.animation = animationInput.checked;
    save(STORE.animation, state.animation ? 'on' : 'off');
    document.body.classList.toggle('no-animation', !state.animation);
  };

  animation.appendChild(animationInput);
  panel.appendChild(animation);

  const stars = document.createElement('div');
  stars.className = 'setting';
  stars.textContent = '⭐ Bintang terkumpul: ' + state.stars;
  panel.appendChild(stars);

  const reset = document.createElement('button');
  reset.className = 'btn';
  reset.textContent = 'Reset Bintang';

  reset.onclick = () => {
    if (confirm('Reset semua bintang?')) {
      state.stars = 0;
      save(STORE.stars, '0');
      updateCounter();
      renderParent();
    }
  };

  panel.appendChild(reset);

  const tips = document.createElement('div');
  tips.className = 'setting';
  tips.style.display = 'block';
  tips.innerHTML =
    '<strong>Cadangan aktiviti bersama anak</strong><br><br>' +
    '🐾 Kenal haiwan di sekeliling<br>' +
    '🔢 Kira mainan bersama-sama<br>' +
    '🎨 Cari warna di rumah<br>' +
    '📖 Baca buku bergambar<br>' +
    '😊 Bercakap tentang perasaan';

  panel.appendChild(tips);

  // Kredit sumber dikekalkan di bahagian ibu bapa supaya kad pembelajaran bersih.
  const mediaSources = document.createElement('details');
  mediaSources.className = 'setting';
  mediaSources.style.display = 'block';
  const mediaSummary = document.createElement('summary');
  mediaSummary.textContent = '📷 Sumber gambar & bunyi haiwan';
  mediaSummary.style.cursor = 'pointer';
  mediaSummary.style.fontWeight = '800';
  mediaSources.appendChild(mediaSummary);
  const mediaList = document.createElement('ul');
  mediaList.style.paddingLeft = '20px';
  mediaList.style.lineHeight = '1.5';
  ANIMALS.filter(animal => animal.credit).forEach(animal => {
    const item = document.createElement('li');
    item.style.margin = '8px 0';
    item.textContent = animal.name + ' — ' + animal.credit;
    mediaList.appendChild(item);
  });
  mediaSources.appendChild(mediaList);
  panel.appendChild(mediaSources);
}

/* ---------------- INIT ---------------- */

document.addEventListener('DOMContentLoaded', () => {
  renderAges();
  updateCounter();

  if (!state.animation) {
    document.body.classList.add('no-animation');
  }
});
</script>
</body>
